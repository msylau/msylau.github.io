
- date: <strong>December 2025</strong>
  headline: >
   Dr. Lau joins the journal Epidemics as an Editor.

- date: <strong>October 2025</strong>
  headline: >
   Our new NIH R01 grant (Dr. Lau as MPI) has been officially awarded. We will be developing foundation AI models for epidemics.

- date: <strong>August 2025</strong>
  headline: >
   Our paper abstract on modeling within-host viral load dynamics has been accepted for oral presentation at the flagship conference
   Epidemics 10. The project is led by our former PhD student, Hannah Waddel.
   
- date: <strong>July 2025</strong>
  headline: >
   Max Lau was invited to speak at the annual symposium of UL Research Institutes during the panel discussion, "AI and the Exposome".
    
- date: <strong>July 2025</strong>
  headline: >
    Our PhD student Hannah Waddel successfully defends her thesis! Congratulations, Dr. Waddel!

- date: <strong>June 2025</strong>
  headline: >
    Our first NIH R01 has been officially awarded (via NIAID; 3.5M; 5 years).

- date: <strong>June 2025</strong>
  headline: >
    Our paper on developing scalable Bayesian phylodynamic modeling methods (led by Hannah Waddel) is published at PLOS Computational Biology  
    [Pub Link](https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1012657)
