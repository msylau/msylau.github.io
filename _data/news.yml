- date: August 2025
  headline: >
   Our abstract, "A Generalized Bayesian Hierarchical Approach for Modeling Within-Host Temporal Viral Load Dynamics," has been accepted for oral presentation at the flagship conference Epidemics 10. The project is led by our former PhD student, Hannah Waddel.
    
- date: July 2025
  headline: >
    Our PhD student Hannah Waddel successfully defends her thesis! Congratulations, Dr. Waddel!

